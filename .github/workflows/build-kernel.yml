name: Build Kernel & IgH EtherCAT DEBs

# ─────────────────────────────────────────────────────────────
# 触发条件
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [master]
    paths:
      - 'external/config/boards/robopi1.conf'
      - 'external/config/boards/robopi2.conf'
      - 'external/config/sources/families/rockchip-rk3588.conf'
      - 'external/config/kernel/**'
      - 'userpatches/kernel/**'
      - 'scripts/compilation.sh'
      - 'scripts/configuration.sh'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'external/config/boards/robopi1.conf'
      - 'external/config/boards/robopi2.conf'
      - 'external/config/sources/families/rockchip-rk3588.conf'
      - 'external/config/kernel/**'
      - 'userpatches/kernel/**'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────
# 环境变量
# ─────────────────────────────────────────────────────────────

jobs:
  build:
    name: ${{ matrix.board }} / current (6.1.99)
    runs-on: ubuntu-22.04  # 修改: 使用标准 x86_64 机器
    strategy:
      fail-fast: false
      matrix:
        board: [robopi1, robopi2]

    steps:
      # ── 1. 释放磁盘空间（必须在 checkout 之前，否则会覆盖工作区）──
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ── 2. 拉取代码 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. 安装构建依赖 ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl aria2 bc binfmt-support binutils bison btrfs-progs \
            build-essential ca-certificates ccache cpio cryptsetup-bin \
            debian-archive-keyring debootstrap device-tree-compiler \
            dialog dosfstools dwarves f2fs-tools fakeroot fdisk flex \
            gawk gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabi gdisk git imagemagick jq kmod \
            libbison-dev libelf-dev libfdt-dev libfile-fcntllock-perl \
            libfl-dev liblz4-tool libncurses5-dev libssl-dev \
            libusb-1.0-0-dev lsb-release lzop ncurses-base ncurses-term \
            p7zip-full parted patchutils pigz pixz pkg-config psmisc \
            pv python3 python3-dev python3-setuptools \
            qemu-user-static rsync swig u-boot-tools unzip \
            uuid uuid-dev uuid-runtime wget whiptail xxd zip zlib1g-dev \
            autoconf automake libtool debhelper
          sudo locale-gen en_US.UTF-8

      # 修改2：增加对 toolchains 文件夹的缓存机制，极大加速构建！
      - name: Cache toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/
          key: toolchain-x86-rk3588-${{ hashFiles('scripts/general.sh') }}

      # ── 4. 缓存内核源码 ───────────────────────────────────────
      - name: Cache kernel source
        id: cache-kernel

        uses: actions/cache@v4
        with:
          path: kernel/
          key: kernel-current-${{ hashFiles('external/config/sources/families/rockchip-rk3588.conf') }}
          restore-keys: |
            kernel-current-

      # ── 5. 编译内核、头文件、设备树 DEB ─────────────────────
      - name: Build kernel DEBs
        run: |
          sudo bash "$GITHUB_WORKSPACE/build.sh" \
            BOARD=${{ matrix.board }} \
            BRANCH=current \
            BUILD_OPT=kernel \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes \
            CLEAN_LEVEL="debs" \
            USE_TORRENT=no \
            DOWNLOAD_MIRROR="" \
            build_rt_image=no \
            NO_APT_CACHER=yes \
            GITEE_SERVER=no \
            IGNORE_UPDATES=${{ steps.cache-kernel.outputs.cache-hit == 'true' && 'yes' || 'no' }}

      # ── 6. 扩展构建包：克隆并编译 IgH EtherCAT DEB ────────
      - name: Build IgH EtherCAT DEB
        run: |
          # 手动拉取 igh 源码
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/wentywenty/igh-deb.git \
            igh-deb-src
            
          cd igh-deb-src
          
          # 引入被之前 build.sh 自动下载的内核交叉编译工具链
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/toolchains/gcc-arm-11.2-2022.02-x86_64-aarch64-none-linux-gnu/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CROSS_COMPILE="$TOOLCHAIN_BIN/aarch64-none-linux-gnu-"
          
          # 指定刚才编译完的内核源码树
          export KERNEL_SRC="$GITHUB_WORKSPACE/kernel/orange-pi-6.1-rk35xx"
          export ARCH="arm64"
          
          # 通过标准 debian 流程打包 (根据 igh-deb/debian/rules)
          dpkg-buildpackage -d -us -uc -a arm64 -b
          
          # 收集生成的 deb 到 OrangePi 标准输出文件夹里
          sudo cp ../ethercat-igh_*.deb "$GITHUB_WORKSPACE/output/debs/"

      # ── 9. 收集所有指定产物 ───────────────────────────────────
      - name: Collect Target DEBs
        run: |
          mkdir -p output/release-debs
          
          # 指定要收集的包类型关键字
          # U-Boot 通常在 output/debs/u-boot/ 中，内核相关的在 output/debs/ 中，igh 刚刚放入 output/debs/
          
          find output/debs -type f -name "*.deb" | while read -r pkg; do
            if [[ "$pkg" == *"linux-image"* ]] || \
               [[ "$pkg" == *"linux-dtb"* ]] || \
               [[ "$pkg" == *"linux-headers"* ]] || \
               [[ "$pkg" == *"u-boot"* ]] || \
               [[ "$pkg" == *"ethercat-igh"* ]]; then
               cp "$pkg" output/release-debs/
            fi
          done
          
          echo "Selected packages for release:"
          ls -l output/release-debs/
          echo "Total: $(ls output/release-debs/*.deb 2>/dev/null | wc -l) packages"

      # ── 10. 上传 Artifacts ───────────────────────────────────
      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.board }}-current
          path: output/release-debs/
          if-no-files-found: error
          retention-days: 30
          
      - name: Ensure zstd installed
        run: sudo apt-get update && sudo apt-get install -y zstd

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04  # 修改: 换回标准 x86_64 机器
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-debs/
          pattern: debs-*
          merge-multiple: false

      - name: List release files
        run: find release-debs/ -name "*.deb" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-debs/**/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
